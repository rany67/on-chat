<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-container" class="container">
        <h2>💬 Bem-vindo ao Chat!</h2>
        <div class="form-group">
            <input type="text" id="username" placeholder="Escolha um usuário" class="input-field">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Crie uma senha" class="input-field">
        </div>
        <button onclick="fazerLogin()" class="btn">Entrar no Chat</button>
        <p id="mensagem" class="mensagem"></p>
    </div>

    <!-- Tela do Chat (inicialmente escondida) -->
    <div id="chat-container" class="container" style="display: none;">
        <h2>💬 Chat Online</h2>
        <div id="mensagens" class="mensagens-container"></div>
        <div class="input-group">
            <input type="text" id="mensagem-input" placeholder="Digite sua mensagem..." class="input-field">
            <button onclick="enviarMensagem()" class="btn">Enviar</button>
        </div>
        <button onclick="sair()" class="btn-sair">Sair</button>
    </div>

    <script src="login.js"></script>
    <script src="script.js"></script>
</body>
</html>
